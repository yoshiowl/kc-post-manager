<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KC投稿管理ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2346D4;--blue-dark:#1530A0;--yellow:#F5C800;--yellow-light:#FFF8D6;--yellow-dark:#B8960A;--cyan:#00BCD4;--cyan-light:#E0F7FA;--cyan-dark:#00838F;--red:#E24B4A;--red-light:#FCEBEB;--gray-light:#F0F2FA;--gray:#B0B8D8;--bg:#EEF1FF;--bg2:#fff;--border:rgba(35,70,212,.15);--text:#1a1f4e;--text2:#5560a0;--text3:#8890c8;--radius:16px;--radius-sm:12px}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:80px}
.hdr{background:var(--blue);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.hdr-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
.hdr h1{font-size:14px;font-weight:700;color:#fff}
.hdr-sync{font-size:11px;color:rgba(255,255,255,.6);margin-left:auto}
.tabs{display:flex;background:var(--blue-dark);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:11px 8px;font-size:12px;font-weight:500;font-family:inherit;color:rgba(255,255,255,.5);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-width:60px}
.tab.active{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none;padding:14px 16px}
.view.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--blue);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer}
.stat-val{font-size:22px;font-weight:700;color:var(--yellow)}
.stat-lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}
.sec{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.member-icons{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mic-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-family:inherit}
.mic-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:transform .15s;border:3px solid transparent;overflow:hidden}
.mic-btn:active .mic-av{transform:scale(.93)}
.mic-nm{font-size:10px;color:var(--text2);max-width:52px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--bg2);border:2px solid #E8EEFF;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card.wip{border-color:#F48FB1;background:#FCE4EC}
.card.done{border-color:var(--cyan);background:var(--cyan-light)}
.card.late{border-color:var(--red);background:var(--red-light)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.name{font-size:14px;font-weight:700;color:var(--text)}
.meta{font-size:11px;color:var(--text3);margin-top:2px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--yellow-light);color:var(--yellow-dark);font-weight:700}
.dl-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.dl-ok{background:var(--cyan-light);color:var(--cyan-dark)}
.dl-warn{background:var(--yellow-light);color:var(--yellow-dark)}
.dl-over{background:var(--red-light);color:var(--red)}
.st-sel{font-size:12px;font-weight:700;padding:7px 10px;border-radius:20px;border:2px solid;cursor:pointer;font-family:inherit;outline:none}
.st-before{border-color:var(--gray);background:var(--gray-light);color:var(--gray)}
.st-wip{border-color:var(--cyan);background:var(--cyan-light);color:var(--cyan-dark)}
.st-done{border-color:var(--yellow);background:var(--yellow-light);color:var(--yellow-dark)}
.memo-area{margin-top:10px}
.memo-area textarea{font-size:12px;height:46px;font-family:inherit;resize:none;width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none}
.memo-area textarea:focus{border-color:var(--blue)}
.memo-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.btn-ghost{font-size:11px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{font-size:11px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--red);background:none;color:var(--red);cursor:pointer;font-family:inherit}
.saved-txt{font-size:11px;color:var(--cyan-dark)}
.toggle-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:5px;font-family:inherit;margin-bottom:4px}
.add-form{background:var(--bg2);border:2px solid #E8EEFF;border-radius:var(--radius);padding:14px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.fg1{grid-template-columns:1fr;margin-bottom:8px}
.add-form input,.add-form select,.add-form textarea{font-size:13px;font-family:inherit;width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none}
.add-form input:focus,.add-form select:focus,.add-form textarea:focus{border-color:var(--blue)}
.add-form textarea{height:54px;resize:none}
.btn-main{width:100%;padding:10px;font-size:14px;font-weight:700;background:var(--yellow);color:var(--blue);border:none;border-radius:20px;cursor:pointer;font-family:inherit}
.btn-main:hover{background:var(--yellow-dark);color:#fff}
.log-bars{margin-bottom:4px}
.bar-row{margin-bottom:10px}
.bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bar-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text)}
.bar-cnt{font-size:13px;color:var(--text2)}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--blue);transition:width .5s}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-num{font-size:11px;color:var(--text3);min-width:22px;padding-top:2px}
.log-body{flex:1;min-width:0}
.log-nr{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.log-nm{font-size:13px;font-weight:700;color:var(--text)}
.log-sub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-ts{font-size:11px;color:var(--text3);white-space:nowrap}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav button{background:none;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;color:var(--text);font-size:13px;font-family:inherit}
.cal-ttl{font-size:15px;font-weight:700;color:var(--text)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cdlbl{font-size:10px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0}
.ccell{display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-radius:10px;cursor:pointer;min-height:38px}
.ccell .dn{font-size:12px;color:var(--text2)}
.ccell.today .dn{background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.ccell.has{background:#E8EEFF}
.ccell.has .dn{color:var(--blue)}
.ccell.urg{background:var(--red-light)}
.ccell.urg .dn{color:var(--red)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--blue);margin-top:2px}
.cdot.u{background:var(--red)}
.cal-leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.leg-dot{width:10px;height:10px;border-radius:50%}
.empty{text-align:center;padding:28px 0;color:var(--text3);font-size:13px}
.host-card{background:var(--bg2);border:2px solid #E8EEFF;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.task-row{border-top:1px solid var(--border);padding-top:10px;margin-top:6px}
.edit-form{background:var(--bg);border-radius:var(--radius-sm);padding:10px;margin-top:8px;display:none}
.edit-form.open{display:block}
.edit-form input,.edit-form select{font-size:12px;font-family:inherit;margin-bottom:6px;width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);outline:none}
.edit-actions{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--blue);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:20px;transition:transform .3s;z-index:100;white-space:nowrap;font-family:'Zen Maru Gothic',sans-serif}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,20,80,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;font-family:'Zen Maru Gothic',sans-serif}
.modal-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-close{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3)}
.ptask{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.ptask-nm{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text)}
.ptask-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill-b{background:var(--gray-light);color:var(--gray)}
.pill-w{background:var(--cyan-light);color:var(--cyan-dark)}
.pill-d{background:var(--yellow-light);color:var(--yellow-dark)}
.av-wrap{position:relative;flex-shrink:0}
.av-edit-btn{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.av-input{display:none}
@media(max-width:480px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<script>
const SB_URL='https://gnvhnjkndijchfqaeloe.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdudmhuamtuZGlqY2hmcWFlbG9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNjk1OTgsImV4cCI6MjA5MDY0NTU5OH0.OCCB017F2ibVgJOq0khCtGtlblJUTEa_GkwRqndsGrc';
const TBL='members';
const COLORS=[{bg:'#E1F5EE',fg:'#085041'},{bg:'#EEEDFE',fg:'#3C3489'},{bg:'#FAECE7',fg:'#712B13'},{bg:'#E6F1FB',fg:'#0C447C'},{bg:'#FAEEDA',fg:'#633806'},{bg:'#FBEAF0',fg:'#72243E'}];
let members=[],showDone=false,filterSt='all',calY=new Date().getFullYear(),calM=new Date().getMonth();
let avatars={};

async function sbApi(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(SB_URL+'/rest/v1/'+path,opts);
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}

async function load(){
  try{
    members=await sbApi(TBL+'?order=deadline.asc.nullslast&select=*')||[];
    members.forEach(m=>{if(m.avatar)avatars[m.name]=m.avatar;});
    renderAll();
    document.getElementById('sync-txt').textContent='同期済み ✓';
  }catch(e){
    document.getElementById('sync-txt').textContent='接続エラー';
    showToast('データ取得に失敗しました');
  }
}

function initials(n){return n.replace(/さん|くん|ちゃん/g,'').slice(0,2);}
function ci(name){const names=[...new Set(members.map(m=>m.name))];const i=names.indexOf(name);return i<0?0:i%COLORS.length;}
function avHTML(name,sz=38,fs=12){
  const img=avatars[name];const c=COLORS[ci(name)];
  if(img)return`<div class="av" style="width:${sz}px;height:${sz}px"><img src="${img}"></div>`;
  return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${fs}px;background:${c.bg};color:${c.fg}">${initials(name)}</div>`;
}
function getSt(m){return m.status||(m.posted?'done':'before');}
function isLate(m){if(getSt(m)==='done'||!m.deadline)return false;return new Date(m.deadline)<new Date(new Date().toDateString());}
function daysLeft(m){if(!m.deadline)return null;return Math.floor((new Date(m.deadline)-new Date(new Date().toDateString()))/86400000);}
function fmtDate(iso){if(!iso)return'';return iso.slice(5,10).replace('-','/');}
function fmtTs(ts){if(!ts)return'';const d=new Date(ts);return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function dlBadge(m){
  const d=daysLeft(m);if(d===null)return'';
  if(d>3)return`<span class="dl-badge dl-ok">残り${d}日</span>`;
  if(d>0)return`<span class="dl-badge dl-warn">残り${d}日</span>`;
  if(d===0)return`<span class="dl-badge dl-over">締切当日</span>`;
  return`<span class="dl-badge dl-over">${Math.abs(d)}日超過</span>`;
}
function stClass(st){return st==='wip'?'st-wip':st==='done'?'st-done':'st-before';}
function stLabel(st){return st==='done'?'完成':st==='wip'?'作成中':'作成前';}
function cardClass(m){const s=getSt(m);if(isLate(m))return'card late';if(s==='wip')return'card wip';if(s==='done')return'card done';return'card';}
function getNames(){return[...new Set(members.map(m=>m.name).filter(Boolean))];}

function renderAll(){renderStats();renderMemberIcons();renderMembers();renderHost();renderLog();renderRenameSelect();}

function renderStats(){
  const t=members.length,b=members.filter(m=>getSt(m)==='before').length,w=members.filter(m=>getSt(m)==='wip').length,d=members.filter(m=>getSt(m)==='done').length;
  document.getElementById('stats').innerHTML=
    `<div class="stat" onclick="setFilter('all')"><div class="stat-val">${t}</div><div class="stat-lbl">全タスク</div></div>`+
    `<div class="stat" onclick="setFilter('wip')"><div class="stat-val" style="color:#F48FB1">${w}</div><div class="stat-lbl">作成中</div></div>`+
    `<div class="stat" onclick="setFilter('done')"><div class="stat-val" style="color:#00BCD4">${d}</div><div class="stat-lbl">完了</div></div>`+
    `<div class="stat" onclick="setFilter('before')"><div class="stat-val" style="color:rgba(255,255,255,0.4)">${b}</div><div class="stat-lbl">未着手</div></div>`;
}

function renderMemberIcons(){
  const names=getNames();
  document.getElementById('mic').innerHTML=names.map(name=>{
    const ts=members.filter(m=>m.name===name);
    const done=ts.filter(m=>getSt(m)==='done').length;
    const wip=ts.some(m=>getSt(m)==='wip');
    const bc=done===ts.length?'#F5C800':wip?'#00BCD4':'#E8EEFF';
    const c=COLORS[ci(name)];
    return`<button class="mic-btn" onclick="openProfileByName('${name}')">
      <div class="mic-av" style="background:${c.bg};color:${c.fg};border-color:${bc}">${avatars[name]?`<img src="${avatars[name]}" style="width:100%;height:100%;object-fit:cover">`:initials(name)}</div>
      <span class="mic-nm">${name}</span>
    </button>`;
  }).join('');
}

function renderMembers(){
  const tog=document.getElementById('tog-btn');
  const dc=members.filter(m=>getSt(m)==='done').length;
  tog.textContent=(showDone?'▼ 完了済みを非表示':'▶ 完了済みを表示')+(dc?` (${dc})`:'');
  let list=members.filter(m=>{const s=getSt(m);if(filterSt!=='all')return s===filterSt;return showDone||s!=='done';});
  if(!list.length){document.getElementById('mlist').innerHTML='<p class="empty">タスクがありません</p>';return;}
  document.getElementById('mlist').innerHTML=list.map(m=>{
    const s=getSt(m);
    return`<div class="${cardClass(m)}">
      <div class="row">
        <div class="av-wrap">
          ${avHTML(m.name,38,12)}
          <button class="av-edit-btn" onclick="triggerAv('${m.name}')" title="写真変更">+</button>
          <input type="file" accept="image/*" class="av-input" id="avi-${m.name}" onchange="handleAv(event,'${m.name}')">
        </div>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:6px">
            <span class="name">${m.name}</span>
            ${isLate(m)?'<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:#FCEBEB;color:#A32D2D;font-weight:700">遅延</span>':''}
            ${m.cat?`<span class="tag">${m.cat}</span>`:''}
            ${getSt(m)!=='done'?dlBadge(m):''}
          </div>
          <div class="meta">${m.theme||'テーマ未設定'}${m.deadline?' ・ 締切 '+fmtDate(m.deadline):''}</div>
          ${m.memo?`<div style="font-size:11px;color:var(--text2);margin-top:2px">${m.memo}</div>`:''}
        </div>
        <select class="st-sel ${stClass(s)}" onchange="setSt(${m.id},this.value)">
          <option value="before" ${s==='before'?'selected':''}>作成前</option>
          <option value="wip" ${s==='wip'?'selected':''}>作成中</option>
          <option value="done" ${s==='done'?'selected':''}>完成</option>
        </select>
      </div>
      <div class="memo-area">
        <textarea id="um-${m.id}" placeholder="備考メモ">${m.user_memo||''}</textarea>
        <div class="memo-row">
          <button class="btn-ghost" onclick="saveUMemo(${m.id})">メモ保存</button>
          ${m.user_memo?`<span class="saved-txt" id="sv-${m.id}">保存済み</span>`:`<span id="sv-${m.id}"></span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function triggerAv(name){const el=document.getElementById('avi-'+name);if(el)el.click();}
function handleAv(e,name){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    const b64=ev.target.result;
    avatars[name]=b64;
    try{await sbApi(TBL+'?name=eq.'+encodeURIComponent(name),'PATCH',{avatar:b64});}catch(e){}
    renderAll();showToast('写真を更新しました！');
  };
  r.readAsDataURL(f);
}

function renderHost(){
  const names=getNames();
  if(!names.length){document.getElementById('hlist').innerHTML='<p class="empty">まだ参加者がいません</p>';return;}
  let html='';
  names.forEach(name=>{
    const ts=members.filter(m=>m.name===name);
    const done=ts.filter(m=>getSt(m)==='done').length;
    const wip=ts.filter(m=>getSt(m)==='wip').length;
    const total=ts.length;
    const sumCol=done===total?'#00838F':wip>0?'#F06292':'var(--text3)';
    let rows=ts.map(t=>{
      const s=getSt(t);
      return`<div class="task-row">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:500;color:var(--text)">${t.cat||''}${t.theme?' / '+t.theme:''}</div>
            <div style="font-size:11px;color:var(--text3)">${t.deadline?'締切 '+fmtDate(t.deadline):''}</div>
          </div>
          <span style="font-size:11px;font-weight:700;color:${s==='done'?'#00838F':s==='wip'?'#F06292':'#B0B8D8'}">${stLabel(s)}</span>
          <button class="btn-ghost" onclick="toggleEdit(${t.id})">編集</button>
          <button class="btn-danger" onclick="delMember(${t.id})">削除</button>
        </div>
        <div class="edit-form" id="ef-${t.id}">
          <select id="ec-${t.id}">${['リール','ストーリー','フィード','ラジオ','ルーム'].map(c=>`<option ${t.cat===c?'selected':''}>${c}</option>`).join('')}</select>
          <input id="eth-${t.id}" value="${t.theme||''}" placeholder="テーマ">
          <input id="edl-${t.id}" type="date" value="${t.deadline||''}">
          <div class="edit-actions">
            <button class="btn-ghost" onclick="saveEdit(${t.id})">保存</button>
            <button class="btn-ghost" onclick="toggleEdit(${t.id})">キャンセル</button>
          </div>
        </div>
      </div>`;
    }).join('');
    html+=`<div class="host-card">
      <div class="row" style="margin-bottom:4px">
        ${avHTML(name,38,12)}
        <div style="flex:1"><div class="name">${name}</div><div class="meta" style="color:${sumCol}">${done}完了 / ${wip}作成中 / ${total-done-wip}未着手</div></div>
      </div>${rows}</div>`;
  });
  document.getElementById('hlist').innerHTML=html;
}

function renderLog(){
  const now=new Date();const y=now.getFullYear();const m=now.getMonth();
  const monthly=members.filter(t=>{if(!t.posted_at)return false;const d=new Date(t.posted_at);return d.getFullYear()===y&&d.getMonth()===m;});
  const byName={};monthly.forEach(t=>{byName[t.name]=(byName[t.name]||0)+1;});
  const sorted=Object.entries(byName).sort((a,b)=>b[1]-a[1]);
  const max=sorted.length?sorted[0][1]:1;
  document.getElementById('log-bars').innerHTML=sorted.length?sorted.map(([name,cnt])=>`
    <div class="bar-row">
      <div class="bar-top"><div class="bar-left">${avHTML(name,24,9)}<span>${name}</span></div><span class="bar-cnt">${cnt}本</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/max*100)}%"></div></div>
    </div>`).join(''):'<p class="empty">今月の完了記録なし</p>';
  const done=[...members].filter(m=>getSt(m)==='done').sort((a,b)=>new Date(b.posted_at)-new Date(a.posted_at));
  document.getElementById('log-list').innerHTML=done.length?done.map((m,i)=>`
    <div class="log-item">
      <div class="log-num">#${done.length-i}</div>
      <div class="log-body">
        <div class="log-nr">${avHTML(m.name,22,9)}<span class="log-nm">${m.name}</span>${m.cat?`<span class="tag">${m.cat}</span>`:''}</div>
        ${m.theme?`<div class="log-sub">${m.theme}</div>`:''}
      </div>
      <div class="log-ts">${fmtTs(m.posted_at)}</div>
    </div>`).join(''):'<p class="empty">まだ完了記録がありません</p>';
}

function renderCal(){
  document.getElementById('cal-ttl').textContent=`${calY}年 ${calM+1}月`;
  const td=new Date();
  const firstDow=(new Date(calY,calM,1).getDay()+6)%7;
  const daysInM=new Date(calY,calM+1,0).getDate();
  const daysInP=new Date(calY,calM,0).getDate();
  const byDate={};members.forEach(m=>{if(!m.deadline)return;const k=m.deadline.slice(0,10);if(!byDate[k])byDate[k]=[];byDate[k].push(m);});
  let html=['月','火','水','木','金','土','日'].map((d,i)=>`<div class="cdlbl" style="${i>=5?'color:#B0B8D8':''}">${d}</div>`).join('');
  let cells=[];
  for(let i=0;i<firstDow;i++)cells.push({day:daysInP-firstDow+1+i,cur:false});
  for(let i=1;i<=daysInM;i++)cells.push({day:i,cur:true});
  while(cells.length%7!==0)cells.push({day:cells.length-daysInM-firstDow+1,cur:false});
  cells.forEach((c,i)=>{
    const isT=c.cur&&c.day===td.getDate()&&calM===td.getMonth()&&calY===td.getFullYear();
    const dk=`${calY}-${String(calM+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const ts=c.cur&&byDate[dk]?byDate[dk]:[];
    const urg=ts.some(m=>isLate(m));
    let cls='ccell';if(!c.cur)cls+=' other';if(isT)cls+=' today';if(ts.length)cls+=urg?' urg':' has';
    html+=`<div class="${cls}" onclick="showCalDay('${dk}')"><span class="dn">${c.day}</span>${ts.length?`<div class="cdot${urg?' u':''}"></div>`:''}</div>`;
  });
  document.getElementById('cgrid').innerHTML=html;
  document.getElementById('cal-det').innerHTML='';
}

function showCalDay(ds){
  const ts=members.filter(m=>m.deadline&&m.deadline.slice(0,10)===ds);
  if(!ts.length)return;
  let html=`<p class="sec">${ds} のタスク</p>`;
  ts.forEach(t=>{
    html+=`<div class="card" style="margin-bottom:8px">
      <div class="row">${avHTML(t.name,32,11)}<div><span class="name">${t.name}</span>${t.cat?`<span class="tag" style="margin-left:6px">${t.cat}</span>`:''}</div></div>
      <div style="font-size:13px;margin-top:6px;color:var(--text)">${t.theme||'テーマ未設定'}</div>
    </div>`;
  });
  document.getElementById('cal-det').innerHTML=html;
}

async function setSt(id,val){
  const body={status:val};
  if(val==='done'){body.posted=true;body.posted_at=new Date().toISOString();}
  if(val==='before'){body.posted=false;body.posted_at=null;}
  try{await sbApi(TBL+'?id=eq.'+id,'PATCH',body);showToast(val==='done'?'完成！✨':val==='wip'?'作成中にしました':'作成前に戻しました');await load();}
  catch(e){showToast('エラーが発生しました');}
}

async function saveUMemo(id){
  const val=document.getElementById('um-'+id).value.trim();
  try{await sbApi(TBL+'?id=eq.'+id,'PATCH',{user_memo:val});const el=document.getElementById('sv-'+id);if(el){el.textContent='保存済み';el.className='saved-txt';}showToast('メモを保存しました！');}
  catch(e){showToast('保存に失敗しました');}
}

async function addMember(){
  const name=document.getElementById('fn').value.trim();
  const theme=document.getElementById('fth').value.trim();
  const cat=document.getElementById('fca').value;
  const deadline=document.getElementById('fdl').value||null;
  const memo=document.getElementById('fme').value.trim();
  const status=document.getElementById('fst').value;
  if(!name){showToast('名前を入力してください');return;}
  try{
    await sbApi(TBL,'POST',{name,theme,cat,deadline,memo,status,posted:status==='done',posted_at:status==='done'?new Date().toISOString():null});
    ['fn','fth','fme'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fdl').value='';document.getElementById('fca').value='';document.getElementById('fst').value='before';
    showToast(name+' を追加しました！');await load();
  }catch(e){showToast('追加に失敗しました: '+e.message);}
}

async function delMember(id){
  if(!confirm('本当に削除しますか？'))return;
  try{await sbApi(TBL+'?id=eq.'+id,'DELETE');showToast('削除しました');await load();}
  catch(e){showToast('削除に失敗しました');}
}

function toggleEdit(id){const el=document.getElementById('ef-'+id);if(el)el.classList.toggle('open');}

async function saveEdit(id){
  const cat=document.getElementById('ec-'+id).value;
  const theme=document.getElementById('eth-'+id).value.trim();
  const deadline=document.getElementById('edl-'+id).value||null;
  try{await sbApi(TBL+'?id=eq.'+id,'PATCH',{cat,theme,deadline});showToast('更新しました！');await load();}
  catch(e){showToast('更新に失敗しました');}
}

function showTab(t,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-'+t).classList.add('active');
  if(t==='cal')renderCal();
}

function renderRenameSelect(){
  const sel=document.getElementById('rn-from');
  if(!sel)return;
  const names=getNames();
  sel.innerHTML=names.map(n=>`<option value="${n}">${n}</option>`).join('');
}

async function bulkRename(){
  const from=document.getElementById('rn-from').value;
  const to=document.getElementById('rn-to').value.trim();
  if(!from||!to){showToast('名前を入力してください');return;}
  if(from===to){showToast('同じ名前です');return;}
  const targets=members.filter(m=>m.name===from);
  if(!targets.length){showToast('対象タスクが見つかりません');return;}
  if(!confirm(`「${from}」→「${to}」に${targets.length}件変更しますか？`))return;
  try{
    await sbApi(TBL+'?name=eq.'+encodeURIComponent(from),'PATCH',{name:to});
    if(avatars[from]&&!avatars[to]){avatars[to]=avatars[from];delete avatars[from];}
    document.getElementById('rn-to').value='';
    showToast(`「${from}」→「${to}」に変更しました！`);
    await load();
  }catch(e){showToast('変更に失敗しました: '+e.message);}
}

function setFilter(st){filterSt=st;if(st==='done')showDone=true;renderMembers();}
function toggleDone(){showDone=!showDone;renderMembers();}
function chMo(d){calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();}

function openProfileByName(name){
  const ts=members.filter(m=>m.name===name);if(!ts.length)return;
  const c=COLORS[ci(name)];
  const av=document.getElementById('mod-av');
  if(avatars[name]){av.innerHTML=`<img src="${avatars[name]}" style="width:48px;height:48px;border-radius:50%;object-fit:cover">`;av.style.background='none';}
  else{av.style.background=c.bg;av.style.color=c.fg;av.textContent=initials(name);}
  document.getElementById('mod-nm').textContent=name;
  const existingBtn=document.getElementById('mod-av-edit');if(existingBtn)existingBtn.remove();
  const existingInput=document.getElementById('mod-av-input');if(existingInput)existingInput.remove();
  const editBtn=document.createElement('button');
  editBtn.id='mod-av-edit';
  editBtn.textContent='写真を変更';
  editBtn.style.cssText='font-size:11px;padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-family:inherit;margin-top:6px;display:block';
  const fileInput=document.createElement('input');
  fileInput.type='file';fileInput.accept='image/*';fileInput.id='mod-av-input';fileInput.style.display='none';
  fileInput.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async ev=>{
      avatars[name]=ev.target.result;
      try{await sbApi(TBL+'?name=eq.'+encodeURIComponent(name),'PATCH',{avatar:ev.target.result});}catch(e){}
      if(avatars[name]){av.innerHTML=`<img src="${avatars[name]}" style="width:48px;height:48px;border-radius:50%;object-fit:cover">`;av.style.background='none';}
      renderAll();showToast('写真を更新しました！');
    };
    r.readAsDataURL(f);
  };
  editBtn.onclick=()=>fileInput.click();
  const mhdr=document.querySelector('.modal-hdr');
  mhdr.appendChild(fileInput);
  mhdr.insertAdjacentElement('afterend',editBtn);
  const done=ts.filter(m=>getSt(m)==='done').length;
  document.getElementById('mod-sub').textContent=`全${ts.length}タスク / 完了${done}件`;
  const active=ts.filter(m=>getSt(m)!=='done');
  const doneTs=ts.filter(m=>getSt(m)==='done');
  const mkCard=m=>{const s=getSt(m);return`<div class="ptask"><div class="ptask-nm">${m.theme||'テーマ未設定'}${m.cat?` <span style="font-size:10px;color:var(--text3)">${m.cat}</span>`:''}</div><div class="ptask-meta"><span class="pill ${s==='done'?'pill-d':s==='wip'?'pill-w':'pill-b'}">${stLabel(s)}</span><span>${m.deadline?'締切 '+fmtDate(m.deadline):'締切未設定'}</span>${s!=='done'?dlBadge(m):''}</div>${m.posted_at?`<div style="font-size:11px;color:var(--text3);margin-top:4px">完成: ${fmtTs(m.posted_at)}</div>`:''}</div>`;};
  document.getElementById('mod-tasks').innerHTML=active.length?active.map(mkCard).join(''):'<p style="font-size:13px;color:var(--text3)">進行中なし</p>';
  document.getElementById('mod-hist').innerHTML=doneTs.length?doneTs.map(mkCard).join(''):'<p style="font-size:13px;color:var(--text3)">まだ履歴なし</p>';
  document.getElementById('modal-bg').classList.add('open');
}

function closeMod(e){if(e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');}

let tt;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2500);}

load();
</script>
</body>
</html>
